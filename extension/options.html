<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Linear verbinden</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px -apple-system, BlinkMacSystemFont, sans-serif; max-width: 520px; margin: 64px auto; padding: 0 16px; }
  h1 { font-size: 22px; }
  ol { line-height: 1.6; padding-left: 20px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; font: inherit; border-radius: 8px; border: 1px solid #8884; }
  button { margin-top: 12px; padding: 9px 16px; font: 600 14px inherit; border: 0; border-radius: 8px; background: #0095f6; color: #fff; cursor: pointer; }
  button.secondary { background: transparent; color: inherit; border: 1px solid #8884; }
  #status { margin-top: 16px; min-height: 1.4em; }
</style>
</head>
<body>
  <h1>Linear verbinden</h1>
  <ol>
    <li>In Linear: Einstellungen, Konto, <b>Sicherheit &amp; Zugriff</b>.</li>
    <li>Unter <b>Persönliche API-Schlüssel</b> einen neuen Schlüssel anlegen. Lesezugriff reicht.</li>
    <li>Den Schlüssel hier einfügen.</li>
  </ol>
  <input id="key" type="password" placeholder="lin_api_…" autocomplete="off">
  <button id="save">Speichern</button>
  <button id="remove" class="secondary">Schlüssel entfernen</button>
  <p id="status"></p>
  <script src="options.js"></script>
</body>
</html>
